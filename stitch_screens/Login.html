<style>

<body class="bg-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto">
<!-- Logo Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">SmartFinance</h1>
<p class="font-body-md text-body-md text-on-surface-variant">The Reliable Partner for your Business</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-xl shadow-lg p-6 md:p-8 w-full transition-transform hover:-translate-y-1 duration-300">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                        Login
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="mt-6 grid grid-cols-2 gap-4">
<a class="flex justify-center items-center py-2 px-4 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:bg-surface-container-low transition-colors duration-200" href="#">
<span class="material-symbols-outlined mr-2 text-primary" style="font-variation-settings: 'FILL' 1;">account_circle</span>
                        Google
                    </a>
<a class="flex justify-center items-center py-2 px-4 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:bg-surface-container-low transition-colors duration-200" href="#">
<span class="material-symbols-outlined mr-2 text-primary" style="font-variation-settings: 'FILL' 1;">apps</span>
                        Apple
                    </a>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="#">Sign up</a></p>
</div>
</div>
