<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invoice Sent - SmartFinance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .animate-float-up {
            animation: floatUp 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>

                      "tertiary-container": "#07006c",

                      "on-primary-fixed-variant": "#39475f",
                      "on-tertiary-fixed-variant": "#2f2ebe",
                      "outline-variant": "#c5c6cd",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md text-body-md p-margin-mobile md:p-margin-desktop">
<!-- Main Container -->
<main class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-[0px_10px_15px_-3px_rgba(10,25,47,0.1)] border border-outline-variant/30 overflow-hidden relative">
<!-- Decorative Header Pattern (Subtle Celebration) -->
<div class="h-32 bg-gradient-to-r from-primary-container via-surface-tint to-primary-container relative overflow-hidden">
<!-- Abstract Confetti/Geometry using pure CSS/divs -->
<div class="absolute w-8 h-8 rounded-full bg-secondary-container/20 -top-2 left-10 animate-float-up delay-100"></div>
<div class="absolute w-4 h-4 bg-tertiary-fixed/30 top-10 right-20 rotate-45 animate-float-up delay-200"></div>
<div class="absolute w-6 h-6 rounded-sm bg-primary-fixed/20 top-20 left-1/4 rotate-12 animate-float-up delay-300"></div>
<div class="absolute w-10 h-10 rounded-full border border-white/10 top-4 right-8 animate-float-up"></div>
</div>
<!-- Content Area -->
<div class="px-6 pb-8 md:px-8 -mt-12 relative z-10 text-center">
<!-- Success Icon -->
<div class="w-24 h-24 bg-surface-container-lowest rounded-full mx-auto flex items-center justify-center shadow-md border-4 border-surface-container-lowest animate-pop mb-6">
<div class="w-20 h-20 bg-secondary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined fill text-on-secondary-container text-5xl">check_circle</span>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-primary mb-2 animate-float-up delay-100">Invoice Sent Successfully!</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 animate-float-up delay-200">Your client should receive the invoice shortly.</p>
<!-- Invoice Summary Card -->
<div class="bg-surface rounded-lg p-6 mb-8 text-left border border-outline-variant/30 animate-float-up delay-300 hover:-translate-y-1 transition-transform duration-300">
<div class="flex justify-between items-center mb-4 pb-4 border-b border-surface-variant">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Amount Due</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">$4,250.00</p>
</div>
<div class="text-right">
<span class="inline-flex items-center gap-1 bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md px-2 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-on-tertiary-fixed"></span> Sent
                        </span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase mb-1">Invoice Number</p>
<p class="font-mono-data text-mono-data text-primary">INV-2023-089</p>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase mb-1">Client</p>
<p class="font-body-md text-body-md text-primary font-medium">Acme Corp Ltd.</p>
</div>
</div>
</div>
<!-- Actions -->
<div class="space-y-3 animate-float-up delay-300">
<div class="grid grid-cols-2 gap-3">
<button class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-container border border-outline-variant hover:bg-surface-container-high transition-colors font-label-md text-label-md text-on-surface group">
<span class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform">share</span>
                        Share Link
                    </button>
<button class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-container border border-outline-variant hover:bg-surface-container-high transition-colors font-label-md text-label-md text-on-surface group">
<span class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform">download</span>
                        Download PDF
                    </button>
</div>
<a class="w-full flex items-center justify-center py-3 px-4 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity" href="#">
                    Back to Invoices
                </a>
</div>
</div>
</main>
<!-- Suppressed Navigation Shells because this is a transactional/success dead-end screen -->
</body></html>
